name: Deploy portfolio site

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the portfolio
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare the static site
        run: |
          mkdir -p _site
          cp index.html styles.css refinements.css glass.css app.js tracker.js snake-engine.js snake.js tools.js profile-data.js profile-cover.svg profile-tech.svg profile-activity.svg profile-snake-still.svg profile-snake.gif _site/

      - name: Upload the portfolio site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
