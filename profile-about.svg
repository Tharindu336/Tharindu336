<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="205" viewBox="0 0 1200 205" role="img" aria-label="About Tharindu Abeysinghe, an Open University of Sri Lanka student exploring software, computer vision and machine learning."><defs><linearGradient id="glass" x2="1" y2="1"><stop offset="0" stop-color="#edff8b" stop-opacity=".13" /><stop offset=".5" stop-color="#adab49" stop-opacity=".027" /><stop offset="1" stop-color="#f5c43b" stop-opacity=".09" /></linearGradient></defs><rect width="1200" height="205" rx="12" fill="#0d100a" /><rect x=".5" y=".5" width="1199" height="204" rx="12" fill="url(#glass)" stroke="#dce974" stroke-opacity=".25" /><path d="M24 1H1176" stroke="#f4ffae" stroke-opacity=".3" /><rect x="24" y="203" width="0" height="1" fill="#eaff5e" opacity=".45"><animate attributeName="width" from="0" to="1152" dur="7s" repeatCount="indefinite" /></rect><g opacity="1" data-slide="0"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0.0;0.30952380952380953;0.3333333333333333;0.9761904761904762;1.0" dur="21s" repeatCount="indefinite" /><text x="30" y="34" font-family="monospace" font-size="11" fill="#dcec89" letter-spacing="2">01 / ABOUT MYSELF</text><text x="30" y="82" font-family="Arial,sans-serif" font-size="31" fill="#f4f7de" font-weight="600">A curious mind. A builder in progress.</text><text x="30" y="126" font-family="Arial,sans-serif" font-size="19" fill="#bdc7ac">I'm Tharindu Abeysinghe, a student at The Open University of Sri Lanka.</text><text x="30" y="158" font-family="Arial,sans-serif" font-size="19" fill="#bdc7ac">I explore software development, computer vision, and machine learning.</text></g><g opacity="0" data-slide="1"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0;0.30952380952380953;0.3333333333333333;0.6428571428571429;0.6666666666666666;1.0" dur="21s" repeatCount="indefinite" /><text x="30" y="34" font-family="monospace" font-size="11" fill="#dcec89" letter-spacing="2">01 / MY LEARNING JOURNEY</text><text x="30" y="82" font-family="Arial,sans-serif" font-size="31" fill="#f4f7de" font-weight="600">Learning happens in the making.</text><text x="30" y="126" font-family="Arial,sans-serif" font-size="19" fill="#bdc7ac">Projects are how I connect theory with practice, one experiment at a time.</text><text x="30" y="158" font-family="Arial,sans-serif" font-size="19" fill="#bdc7ac">Every idea is a chance to build, reflect, and improve.</text></g><g opacity="0" data-slide="2"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0;0.6428571428571429;0.6666666666666666;0.9761904761904762;1.0" dur="21s" repeatCount="indefinite" /><text x="30" y="34" font-family="monospace" font-size="11" fill="#dcec89" letter-spacing="2">01 / BEHIND THE COMMITS</text><text x="30" y="82" font-family="Arial,sans-serif" font-size="31" fill="#f4f7de" font-weight="600">Code, data, and a little curiosity.</text><text x="30" y="126" font-family="Arial,sans-serif" font-size="19" fill="#bdc7ac">From Ananke and NeuroAurum to PatientPrepSL, I share what I am building.</text><text x="30" y="158" font-family="Arial,sans-serif" font-size="19" fill="#bdc7ac">Explore my repositories to follow the work as it evolves.</text></g></svg>